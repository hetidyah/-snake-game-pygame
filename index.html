<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cute Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-wrapper">
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div class="mobile-controls" id="mobileControls">
            <button class="control up" data-direction="up">▲</button>
            <div class="control-row">
                <button class="control" data-direction="left">◀</button>
                <button class="control" data-direction="down">▼</button>
                <button class="control" data-direction="right">▶</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
