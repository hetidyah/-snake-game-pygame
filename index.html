<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Snake Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         MENU UTAMA
    ========================== -->

    <div id="menuScreen" class="screen">

        <div class="decoration decoration-1"></div>
        <div class="decoration decoration-2"></div>
        <div class="decoration decoration-3"></div>

        <div class="menu-panel">

            <h1>SNAKE GAME</h1>

            <div class="mini-snake">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <p class="welcome">
                Selamat datang di Cute Snake!
            </p>

            <p id="menuBest">
                Best Score : 0
            </p>

            <button id="startButton" class="menu-button start">
                MULAI GAME
            </button>

            <button id="exitButton" class="menu-button exit">
                KELUAR
            </button>

            <p class="controls-info">
                WASD / Arrow Keys / Tombol Arah
            </p>

        </div>

    </div>


    <!-- =========================
         GAME
    ========================== -->

    <div id="gameScreen" class="screen hidden">

        <header class="game-header">

            <div class="score-area">
                <div id="scoreText">
                    Score : 0
                </div>

                <div id="levelText">
                    Level : 1
                </div>
            </div>

            <div id="bestText">
                Best : 0
            </div>

        </header>


        <!-- CANVAS GAME -->

        <canvas id="gameCanvas"></canvas>


        <!-- =========================
             TOMBOL ARAH
        ========================== -->

        <div class="controls">

            <button id="upButton" class="control-button">
                ↑
            </button>

            <button id="leftButton" class="control-button">
                ←
            </button>

            <button id="downButton" class="control-button">
                ↓
            </button>

            <button id="rightButton" class="control-button">
                →
            </button>

        </div>


        <!-- =========================
             GAME OVER
        ========================== -->

        <div id="gameOverScreen" class="game-over hidden">

            <div class="game-over-panel">

                <h2>GAME OVER</h2>

                <p id="finalScore">
                    Score kamu : 0
                </p>

                <div class="game-over-buttons">

                    <button id="restartButton">
                        MAIN LAGI
                    </button>

                    <button id="gameExitButton">
                        KELUAR
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
