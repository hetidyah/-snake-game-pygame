<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Cute Snake Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-wrapper">

        <canvas id="gameCanvas"></canvas>
        <canvas id="gameCanvas" width="900" height="700"></canvas>

<!-- Kontrol ular -->
<div class="controls">
    <button onclick="ubahArah('up')">▲</button>

    <div class="middle-controls">
        <button onclick="ubahArah('left')">◀</button>
        <button onclick="ubahArah('down')">▼</button>
        <button onclick="ubahArah('right')">▶</button>
    </div>
</div>

        <!-- MENU UTAMA -->
        <section id="menu" class="screen">

            <div class="decor decor-1"></div>
            <div class="decor decor-2"></div>
            <div class="decor decor-3"></div>

            <div class="menu-panel">

                <h1>SNAKE GAME</h1>

                <div class="snake-preview">
                    <span></span>
                    <span></span>
                    <span></span>

                    <div class="eye"></div>
                </div>

                <p class="welcome">
                    Welcome to Cute Snake!
                </p>

                <div class="best-score">
                    Best Score : <span id="menuBestScore">0</span>
                </div>

                <button id="startButton">
                    MULAI GAME
                </button>

                <button id="exitButton">
                    KELUAR
                </button>

                <div class="controls-info">
                    <p>WASD / Arrow Keys</p>
                    <p>ESC = Keluar</p>
                </div>

            </div>
        </section>

        <!-- GAME -->
        <section id="gameScreen" class="game-screen hidden">

            <div class="top-bar">

                <div class="info-box">
                    Score: <span id="score">0</span>
                </div>

                <div class="info-box">
                    Level: <span id="level">1</span>
                </div>

                <div class="info-box">
                    Best: <span id="bestScore">0</span>
                </div>

            </div>

            <!-- KONTROL MOBILE -->
            <div class="mobile-controls">

                <button data-direction="up">▲</button>

                <div>
                    <button data-direction="left">◀</button>
                    <button data-direction="down">▼</button>
                    <button data-direction="right">▶</button>
                </div>

            </div>

            <!-- GAME OVER -->
            <div id="gameOver" class="game-over hidden">

                <div class="game-over-box">

                    <h2>GAME OVER</h2>

                    <p class="final-score">
                        Score: <span id="finalScore">0</span>
                    </p>

                    <p>R = Main Lagi</p>
                    <p>ESC = Keluar</p>

                    <button id="restartButton">
                        MAIN LAGI
                    </button>

                    <button id="menuButton">
                        MENU UTAMA
                    </button>

                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
